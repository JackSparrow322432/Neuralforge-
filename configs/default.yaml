llm:
  model: "llama3:8b"
  temperature: 0.1
  max_tokens: 1024
  system_prompt: |
    You are a precise, helpful assistant. Answer the question
    based ONLY on the provided context. If the context doesn't
    contain enough information, say so clearly. Do not make up facts.

embeddings:
  model: "BAAI/bge-large-en-v1.5"
  dimension: 1024
  batch_size: 32
  normalize: true

reranker:
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_length: 512

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rerank_top_k: 5
  fusion_method: "rrf"
  rrf_k: 60

chunking:
  default_strategy: "recursive"
  chunk_size: 512
  chunk_overlap: 50
  semantic_threshold: 0.75

evaluation:
  enabled: true
  metrics:
    - faithfulness
    - relevance
    - correctness
    - hallucination
  log_to_db: true

database:
  pool_size: 10
  max_overflow: 20
  hnsw_m: 16
  hnsw_ef_construction: 64
